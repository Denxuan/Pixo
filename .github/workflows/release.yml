name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwayland-dev libxkbcommon-dev libssl-dev libfuse2
      - run: node .github/scripts/release-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test .github/scripts/release.test.mjs
      - name: Import macOS signing certificate
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE}" || -z "${MACOS_CERTIFICATE_PASSWORD}" ]]; then
            echo "Missing MACOS_CERTIFICATE or MACOS_CERTIFICATE_PASSWORD." >&2
            exit 1
          fi
          cert_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          printf 'sign-probe' > "$RUNNER_TEMP/sign-probe"
          codesign --force --sign 0C8919D845D4DB02FBE57A62A8455D1ECD170353 --keychain "$keychain_path" "$RUNNER_TEMP/sign-probe"
          rm -f "$cert_path"
      - name: Build macOS universal app
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: 0C8919D845D4DB02FBE57A62A8455D1ECD170353
        run: |
          set -euo pipefail
          pnpm tauri build --target universal-apple-darwin --bundles dmg
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/pixo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          if codesign -dvvv "$app" 2>&1 | grep -q "Signature=adhoc"; then
            echo "macOS build was ad hoc signed." >&2
            exit 1
          fi
          actual="$(codesign -d -r- "$app" 2>&1 | sed -n 's/.*certificate leaf = \(H"[0-9A-F]*"\).*/\1/p')"
          expected='H"0C8919D845D4DB02FBE57A62A8455D1ECD170353"'
          if [[ "$actual" != "$expected" ]]; then
            echo "Signing certificate leaf changed: ${actual:-missing}" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/pixo-macos-universal.dmg
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: |
          pnpm tauri build --bundles deb,appimage
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
      - name: Build Windows installers
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          pnpm tauri build --bundles nsis,msi
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: pixo-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pixo-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node .github/scripts/release-version.mjs)
          test -f release-assets/pixo-macos-universal.dmg
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "Pixo $version" --generate-notes --verify-tag

      - name: Verify Homebrew Tap token
        env:
          HOMEBREW_TAP: ${{ secrets.HOMEBREW_TAP }}
        run: |
          if [[ -z "$HOMEBREW_TAP" ]]; then
            echo "Missing HOMEBREW_TAP repository secret with Contents: Read and write access to Denxuan/homebrew-tab." >&2
            exit 1
          fi

      - name: Check out shared Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: Denxuan/homebrew-tab
          token: ${{ secrets.HOMEBREW_TAP }}
          path: homebrew-tap

      - name: Publish Pixo Cask to shared tap
        run: |
          set -euo pipefail
          version=$(node .github/scripts/release-version.mjs)
          (cd "$RUNNER_TEMP" && node "$GITHUB_WORKSPACE/.github/scripts/generate-cask.mjs" "$GITHUB_WORKSPACE/release-assets/pixo-macos-universal.dmg" "$version" "$GITHUB_REPOSITORY")
          mkdir -p homebrew-tap/Casks
          cp "$RUNNER_TEMP/Casks/pixo.rb" homebrew-tap/Casks/pixo.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add Casks/pixo.rb
          if ! git diff --cached --quiet; then
            git commit -m "pixo $GITHUB_REF_NAME"
            git push
          fi
