name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwayland-dev libxkbcommon-dev libssl-dev libfuse2
      - run: node .github/scripts/release-version.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test .github/scripts/release.test.mjs
      - name: Build macOS universal app
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for secret in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!secret:-}" ]; then
              echo "Missing required macOS signing secret: $secret" >&2
              exit 1
            fi
          done
          pnpm tauri build --target universal-apple-darwin --bundles dmg
          mkdir -p release-assets
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/pixo-macos-universal.dmg
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: |
          pnpm tauri build --bundles deb,appimage
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
      - name: Build Windows installers
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          pnpm tauri build --bundles nsis,msi
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: pixo-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pixo-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node .github/scripts/release-version.mjs)
          test -f release-assets/pixo-macos-universal.dmg
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --title "Pixo $version" --generate-notes --verify-tag

      - name: Verify Homebrew Tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "Missing HOMEBREW_TAP_TOKEN repository secret with Contents: Read and write access to Denxuan/homebrew-tab." >&2
            exit 1
          fi

      - name: Check out shared Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: Denxuan/homebrew-tab
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Pixo Cask to shared tap
        run: |
          set -euo pipefail
          version=$(node .github/scripts/release-version.mjs)
          (cd "$RUNNER_TEMP" && node "$GITHUB_WORKSPACE/.github/scripts/generate-cask.mjs" "$GITHUB_WORKSPACE/release-assets/pixo-macos-universal.dmg" "$version" "$GITHUB_REPOSITORY")
          mkdir -p homebrew-tap/Casks
          cp "$RUNNER_TEMP/Casks/pixo.rb" homebrew-tap/Casks/pixo.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add Casks/pixo.rb
          if ! git diff --cached --quiet; then
            git commit -m "pixo $GITHUB_REF_NAME"
            git push
          fi
