<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pixo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #f5f5f5;
      }

      html[data-boot="dark"],
      html[data-boot="dark"] body,
      html[data-boot="dark"] #root {
        background: #000;
        color-scheme: dark;
      }

      html[data-surface="panel"],
      html[data-surface="panel"] body,
      html[data-surface="panel"] #root {
        background: transparent;
      }
    </style>
    <script>
      (function () {
        if (location.search.indexOf("view=panel") !== -1) {
          document.documentElement.setAttribute("data-surface", "panel");
          return;
        }
        var mode = "system";
        var language = "zh-CN";
        try {
          var saved = JSON.parse(localStorage.getItem("pixo-theme") || "null");
          if (saved && saved.state) {
            if (saved.state.mode) mode = saved.state.mode;
            if (saved.state.language) language = saved.state.language;
          }
        } catch (error) {}
        var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.setAttribute("data-boot", "dark");
        document.documentElement.lang = language === "en" ? "en" : "zh-CN";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
